<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Timetable</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --grid-line: #f1f5f9;
            --canceled-bg: #e2e8f0;
            --canceled-text: #94a3b8;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --surface-color: #1e293b;
                --text-main: #f8fafc;
                --text-muted: #94a3b8;
                --border-color: #334155;
                --grid-line: #1e293b;
                --canceled-bg: #334155;
                --canceled-text: #64748b;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        header {
            padding: 1rem 1.5rem;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-title h1 { font-size: 1.2rem; font-weight: 600; }
        .header-title p { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }

        .controls { display: flex; align-items: center; gap: 0.75rem; }
        button {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        button:hover { background-color: var(--border-color); }

        #current-week-label { font-weight: 600; min-width: 140px; text-align: center; font-size: 0.9rem; }

        .main-container { flex: 1; display: flex; overflow-y: auto; padding: 1rem; gap: 1rem; }
        .timetable-wrapper {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .time-column { width: 55px; border-right: 1px solid var(--border-color); position: relative; flex-shrink: 0; }
        .time-label { position: absolute; right: 8px; transform: translateY(-50%); font-size: 0.7rem; color: var(--text-muted); }

        .days-container { display: flex; flex: 1; position: relative; }
        .grid-lines { position: absolute; inset: 0; pointer-events: none; }
        .grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--grid-line); }

        .day-column { flex: 1; border-right: 1px solid var(--border-color); position: relative; }
        .day-column:last-child { border-right: none; }

        .day-header {
            text-align: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.9rem;
            background-color: var(--surface-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .day-header span { display: block; font-size: 0.75rem; color: var(--text-muted); font-weight: 400; margin-top: 0.2rem; }

        .events-container { position: relative; height: 800px; }

        .event {
            position: absolute;
            left: 4px; right: 4px;
            border-radius: 5px;
            padding: 0.4rem;
            font-size: 0.75rem;
            overflow: hidden;
            border-left: 3px solid;
            transition: transform 0.1s;
        }
        .event:hover { transform: scale(1.02); z-index: 5; }
        .event-title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .event-details { font-size: 0.68rem; opacity: 0.85; margin-top: 0.1rem; }

        .event.canceled {
            background-color: var(--canceled-bg) !important;
            color: var(--canceled-text) !important;
            border-left-color: var(--canceled-text) !important;
        }
        .event.canceled .event-title { text-decoration: line-through; }

        .current-time-line {
            position: absolute; left: 0; right: 0; height: 2px;
            background-color: #ef4444; z-index: 20; pointer-events: none;
        }
        .current-time-line::before {
            content: ''; position: absolute; left: -4px; top: -4px;
            width: 10px; height: 10px; border-radius: 50%; background-color: #ef4444;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>Timetable</h1>
            <p id="sub-header">Updating schedule...</p>
        </div>
        <div class="controls">
            <button id="btn-prev">← Prev</button>
            <span id="current-week-label">Loading...</span>
            <button id="btn-next">Next →</button>
            <button id="btn-today">Today</button>
        </div>
    </header>

    <div class="main-container">
        <div class="timetable-wrapper">
            <div class="time-column" id="time-column"></div>
            <div class="days-container" id="days-container">
                <div class="grid-lines" id="grid-lines"></div>
            </div>
        </div>
    </div>

    <script>
        const TARGET_URL = "https://intranet.tam.ch/klw/rest/ics/type/timetable/date/1719488700/auth/gr001@ZmVsaXguYWlrbWFu:MzY3MjBlMTIwYmE3NDYxMjU0ZmQ2YjRkNTExYmRkZjNhYjhkYTYzMQ==/calendar.ics";
        
        // Proxy list to ensure high availability
        const PROXIES = [
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
        ];

        const START_HOUR = 7;
        const END_HOUR = 17;
        const TOTAL_MINUTES = (END_HOUR - START_HOUR) * 60;
        
        const COLORS = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6'];

        let eventsData = [];
        let currentViewDate = new Date();

        async function fetchICS() {
            for (const proxy of PROXIES) {
                try {
                    const res = await fetch(proxy(TARGET_URL) + `&_t=${Date.now()}`);
                    if (!res.ok) continue;
                    const text = await res.text();
                    if (text.includes("BEGIN:VCALENDAR")) return text;
                } catch (e) {
                    continue;
                }
            }
            throw new Error("Unable to fetch schedule through proxies.");
        }

        async function loadData() {
            try {
                const icsText = await fetchICS();
                eventsData = parseICS(icsText);
                document.getElementById('sub-header').innerText = `Auto-updated: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
                renderWeek();
            } catch (err) {
                document.getElementById('sub-header').innerText = "Failed to load schedule";
            }
        }

        function parseICS(ics) {
            ics = ics.replace(/\r?\n /g, "");
            const lines = ics.split(/\r?\n/);
            const events = [];
            let curr = null;

            lines.forEach(line => {
                if (line.startsWith('BEGIN:VEVENT')) curr = { canceled: false };
                else if (line.startsWith('END:VEVENT')) {
                    if (curr?.start && curr?.end) events.push(curr);
                    curr = null;
                } else if (curr) {
                    if (line.startsWith('DTSTART')) curr.start = parseDate(line);
                    else if (line.startsWith('DTEND')) curr.end = parseDate(line);
                    else if (line.startsWith('SUMMARY:')) {
                        curr.summary = line.substring(8);
                        if (curr.summary.toLowerCase().includes('(gestrichen)')) curr.canceled = true;
                    } 
                    else if (line.startsWith('LOCATION:')) curr.location = line.substring(9);
                }
            });
            return events;
        }

        function parseDate(line) {
            const dateStr = line.split(':')[1];
            const y = parseInt(dateStr.substr(0, 4)), m = parseInt(dateStr.substr(4, 2)) - 1, d = parseInt(dateStr.substr(6, 2));
            if (dateStr.includes('T')) {
                const h = parseInt(dateStr.substr(9, 2)), min = parseInt(dateStr.substr(11, 2)), s = parseInt(dateStr.substr(13, 2));
                return dateStr.endsWith('Z') ? new Date(Date.UTC(y, m, d, h, min, s)) : new Date(y, m, d, h, min, s);
            }
            return new Date(y, m, d);
        }

        function getColor(str) {
            let hash = 0;
            const sub = str.split(',')[0].replace(/[\(\)gestrichenRaumwechsel]/gi, '').trim();
            for (let i = 0; i < sub.length; i++) hash = sub.charCodeAt(i) + ((hash << 5) - hash);
            return COLORS[Math.abs(hash) % COLORS.length];
        }

        function setupGrid() {
            const timeCol = document.getElementById('time-column');
            const gridLines = document.getElementById('grid-lines');
            for (let h = START_HOUR; h <= END_HOUR; h++) {
                const pct = ((h - START_HOUR) * 60) / TOTAL_MINUTES * 100;
                
                const label = document.createElement('div');
                label.className = 'time-label';
                label.style.top = `${pct}%`;
                label.innerText = `${h}:00`;
                timeCol.appendChild(label);

                const line = document.createElement('div');
                line.className = 'grid-line';
                line.style.top = `${pct}%`;
                gridLines.appendChild(line);
            }
        }

        function getMonday(d) {
            d = new Date(d);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function renderWeek() {
            document.querySelectorAll('.day-column').forEach(e => e.remove());
            const container = document.getElementById('days-container');
            const monday = getMonday(currentViewDate);
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

            document.getElementById('current-week-label').innerText = 
                `${monday.getDate()} ${monday.toLocaleString('default', {month:'short'})} - ${new Date(monday.getTime() + 4 * 86400000).getDate()} ${new Date(monday.getTime() + 4 * 86400000).toLocaleString('default', {month:'short'})}`;

            days.forEach((dayName, idx) => {
                const date = new Date(monday.getTime() + (idx * 86400000));
                const col = document.createElement('div');
                col.className = 'day-column';

                col.innerHTML = `<div class="day-header">${dayName}<span>${date.getDate()}.${date.getMonth()+1}.</span></div>`;

                const eventsWrap = document.createElement('div');
                eventsWrap.className = 'events-container';

                const dayEvents = eventsData.filter(e => 
                    e.start.getFullYear() === date.getFullYear() &&
                    e.start.getMonth() === date.getMonth() &&
                    e.start.getDate() === date.getDate()
                );

                dayEvents.forEach(evt => {
                    const startMins = (evt.start.getHours() - START_HOUR) * 60 + evt.start.getMinutes();
                    const durationMins = (evt.end.getTime() - evt.start.getTime()) / 60000;
                    if (startMins < 0 || startMins > TOTAL_MINUTES) return;

                    const el = document.createElement('div');
                    el.className = `event ${evt.canceled ? 'canceled' : ''}`;
                    el.style.top = `${(startMins / TOTAL_MINUTES) * 100}%`;
                    el.style.height = `${(durationMins / TOTAL_MINUTES) * 100}%`;

                    if (!evt.canceled) {
                        const c = getColor(evt.summary);
                        el.style.backgroundColor = `${c}22`;
                        el.style.borderColor = c;
                        el.style.color = c;
                    }

                    el.innerHTML = `
                        <div class="event-title">${evt.summary}</div>
                        <div class="event-details">${evt.start.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}${evt.location ? ` | ${evt.location}` : ''}</div>
                    `;
                    eventsWrap.appendChild(el);
                });

                const now = new Date();
                if (date.toDateString() === now.toDateString()) {
                    const nowMins = (now.getHours() - START_HOUR) * 60 + now.getMinutes();
                    if (nowMins >= 0 && nowMins <= TOTAL_MINUTES) {
                        const line = document.createElement('div');
                        line.className = 'current-time-line';
                        line.style.top = `${(nowMins / TOTAL_MINUTES) * 100}%`;
                        eventsWrap.appendChild(line);
                    }
                }

                col.appendChild(eventsWrap);
                container.appendChild(col);
            });
        }

        document.getElementById('btn-prev').onclick = () => { currentViewDate.setDate(currentViewDate.getDate() - 7); renderWeek(); };
        document.getElementById('btn-next').onclick = () => { currentViewDate.setDate(currentViewDate.getDate() + 7); renderWeek(); };
        document.getElementById('btn-today').onclick = () => { currentViewDate = new Date(); renderWeek(); };

        setupGrid();
        loadData();
        
        // Auto refresh in background every 10 minutes
        setInterval(loadData, 10 * 60 * 1000);
    </script>
</body>
</html>
